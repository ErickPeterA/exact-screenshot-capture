services:
  jornada-app:
    container_name: jornada-app
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - infra_backend
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  infra_backend:
    external: true
    name: infra_backend
